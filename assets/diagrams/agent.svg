<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">代理活動圖</title><desc id="desc">模型提出動作，政策閘門決定是否允許，工具執行後回傳觀察。拒絕或錯誤也會成為下一輪資訊。抵達預算或授權界線時應停止。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="15" y="15" width="1090" height="420" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="33" y="45" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">Agent harness：模型外圍的執行系統</text><rect x="45" y="145" width="205" height="88" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="147.5" y="189.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">模型</text><text x="147.5" y="218.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">提出下一步</text><path d="M417.5 115 L510 187.5 L417.5 260 L325 187.5 Z" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="417.5" y="195.5" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">允許？</text><rect x="605" y="145" width="205" height="88" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="707.5" y="189.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">工具執行器</text><text x="707.5" y="218.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">使用配置權限</text><rect x="880" y="145" width="185" height="88" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="972.5" y="189.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">執行結果</text><text x="972.5" y="218.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">成功或錯誤</text><path d="M250 189 L325 189" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="250.0" y="143" width="70" height="30" rx="4" fill="#0b1422"/><text x="285" y="165" font-size="22" fill="#99d4ff" text-anchor="middle" font-weight="400">動作</text><path d="M510 189 L605 189" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="520.0" y="143" width="70" height="30" rx="4" fill="#0b1422"/><text x="555" y="165" font-size="22" fill="#99d4ff" text-anchor="middle" font-weight="400">是</text><path d="M810 189 L880 189" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="811.0" y="143" width="70" height="30" rx="4" fill="#0b1422"/><text x="846" y="165" font-size="22" fill="#99d4ff" text-anchor="middle" font-weight="400">執行</text><path d="M417 260 L417 345 L148 345 L148 233" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="222.0" y="308" width="126" height="30" rx="4" fill="#0b1422"/><text x="285" y="330" font-size="22" fill="#99d4ff" text-anchor="middle" font-weight="400">拒絕也回饋</text><path d="M973 233 L973 392 L148 392 L148 233" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="630.0" y="356" width="170" height="30" rx="4" fill="#0b1422"/><text x="715" y="378" font-size="22" fill="#99d4ff" text-anchor="middle" font-weight="400">觀察回到下一輪</text><text x="560" y="75" font-size="23" fill="#bdcbdb" text-anchor="middle" font-weight="400">停止條件：任務完成、超出授權、預算耗盡。</text></g></svg>