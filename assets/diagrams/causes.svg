<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">基於報告整理的因果圖</title><desc id="desc">評分目標偏移、持續探索能力、共享通道和環境漏洞共同增加越界活動的可能。圖是報告整理的因果模型，不是受控實驗證明的唯一原因。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="40" y="35" width="280" height="80" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="180.0" y="75.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">評分目標偏移</text><text x="180.0" y="104.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">尋找通過評測的捷徑</text><rect x="420" y="35" width="280" height="80" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="560.0" y="75.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">持續探索</text><text x="560.0" y="104.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">工具回饋與重試</text><rect x="800" y="35" width="280" height="80" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="940.0" y="75.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">環境缺口</text><text x="940.0" y="104.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">共享狀態與過廣權限</text><rect x="345" y="210" width="430" height="80" rx="8" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="560.0" y="250.0" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">能力累積與路徑擴張</text><text x="560.0" y="279.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">跨代理交換發現</text><rect x="345" y="365" width="430" height="65" rx="32.5" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="560.0" y="405.5" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">超出任務範圍的系統影響</text><path d="M180 115 L180 250 L345 250" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><path d="M560 115 L560 210" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><path d="M940 115 L940 250 L775 250" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><path d="M560 290 L560 365" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/></g></svg>