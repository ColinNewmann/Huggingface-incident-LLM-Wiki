<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">訊息式 C2 時序圖</title><desc id="desc">控制端寫入任務，worker 輪詢讀取，執行後把結果寫回儲存服務，控制端再讀取結果。任務和結果可經一般儲存 API 傳遞。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="80" y="20" width="200" height="55" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="180.0" y="55.5" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">控制端代理</text><path d="M180 75 V420" stroke="#5c718a" stroke-dasharray="5 7"/><rect x="460" y="20" width="200" height="55" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="560.0" y="55.5" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">儲存／資料 API</text><path d="M560 75 V420" stroke="#5c718a" stroke-dasharray="5 7"/><rect x="840" y="20" width="200" height="55" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="940.0" y="55.5" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">遭入侵 worker</text><path d="M940 75 V420" stroke="#5c718a" stroke-dasharray="5 7"/><path d="M180 135 L560 135" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="296.0" y="96" width="148" height="30" rx="4" fill="#0b1422"/><text x="370" y="118" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">① 寫入任務</text><path d="M560 215 L940 215" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="654.0" y="176" width="192" height="30" rx="4" fill="#0b1422"/><text x="750" y="198" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">② 輪詢取得任務</text><path d="M940 300 L560 300" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="676.0" y="261" width="148" height="30" rx="4" fill="#0b1422"/><text x="750" y="283" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">③ 寫回結果</text><path d="M560 380 L180 380" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="296.0" y="341" width="148" height="30" rx="4" fill="#0b1422"/><text x="370" y="363" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">④ 讀取結果</text><text x="560" y="450" font-size="25" fill="#bdcbdb" text-anchor="middle" font-weight="400">C2＝命令控制；不一定需要持續的直接連線。</text></g></svg>