<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">事件中的一條橫向移動路徑</title><desc id="desc">公開鑑識記錄的一條路徑由遭入侵 worker 接觸雲端 metadata，取得節點角色憑證，以節點身分存取 Kubernetes API，再取得 CSI 服務帳號權限。這不是所有代理必經的唯一順序。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="15" y="25" width="315" height="400" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="33" y="55" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">工作負載</text><rect x="375" y="25" width="310" height="400" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="393" y="55" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">雲端身分</text><rect x="730" y="25" width="375" height="400" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="748" y="55" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">Kubernetes</text><rect x="45" y="100" width="255" height="86" rx="8" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="172.5" y="143.0" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">遭入侵 worker</text><text x="172.5" y="172.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">可執行程式</text><rect x="405" y="100" width="250" height="86" rx="8" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="530.0" y="143.0" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">Metadata 服務</text><text x="530.0" y="172.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">可見的節點角色憑證</text><rect x="775" y="100" width="285" height="86" rx="8" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="917.5" y="143.0" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">叢集 API</text><text x="917.5" y="172.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">驗證節點身分</text><rect x="775" y="295" width="285" height="86" rx="8" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="917.5" y="338.0" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">CSI 服務帳號</text><text x="917.5" y="367.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">儲存驅動器的權限</text><path d="M300 143 L405 143" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="300.0" y="93" width="104" height="30" rx="4" fill="#0b1422"/><text x="352" y="115" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">取得身分</text><path d="M655 143 L775 143" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="663.0" y="93" width="104" height="30" rx="4" fill="#0b1422"/><text x="715" y="115" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">身分驗證</text><path d="M917 186 L917 295" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="799.0" y="228" width="236" height="30" rx="4" fill="#0b1422"/><text x="917" y="250" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">取得帳號 token</text><text x="373" y="300" font-size="27" fill="#bdcbdb" text-anchor="middle" font-weight="400">能擴張到哪裡，</text><text x="373" y="340" font-size="27" fill="#bdcbdb" text-anchor="middle" font-weight="400">取決於每一層的授權。</text></g></svg>