<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">JWT 簽發與驗證架構圖</title><desc id="desc">身分服務以私鑰簽發 JWT，接收服務以公鑰驗證，再核對受眾和授權。私鑰曝露讓持有者簽發新 token，不代表簽章演算法被破解。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="20" y="20" width="430" height="405" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="38" y="50" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">簽發端</text><rect x="650" y="20" width="450" height="405" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="668" y="50" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">接收端</text><rect x="60" y="90" width="350" height="70" rx="35.0" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="235.0" y="133.0" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">簽章私鑰</text><rect x="60" y="260" width="350" height="82" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="235.0" y="301.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">簽發 JWT</text><text x="235.0" y="330.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">聲明＋數位簽章</text><rect x="705" y="90" width="340" height="70" rx="35.0" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="875.0" y="133.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">驗證公鑰</text><rect x="705" y="260" width="340" height="82" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="875.0" y="301.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">驗證與授權</text><text x="875.0" y="330.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">簽章、受眾、角色</text><path d="M235 160 L235 260" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="200.0" y="199" width="70" height="30" rx="4" fill="#0b1422"/><text x="235" y="221" font-size="22" fill="#99d4ff" text-anchor="middle" font-weight="400">簽名</text><path d="M410 301 L705 301" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="516.0" y="261" width="82" height="30" rx="4" fill="#0b1422"/><text x="557" y="283" font-size="22" fill="#99d4ff" text-anchor="middle" font-weight="400">JWT</text><path d="M875 160 L875 260" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="840.0" y="199" width="70" height="30" rx="4" fill="#0b1422"/><text x="875" y="221" font-size="22" fill="#99d4ff" text-anchor="middle" font-weight="400">驗證</text><text x="560" y="450" font-size="25" fill="#bdcbdb" text-anchor="middle" font-weight="400">私鑰曝露擴大簽發能力，並非破解演算法。</text></g></svg>