<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">代理出網時序圖</title><desc id="desc">直接出網已受限制，但沙盒可呼叫套件代理。代理的第二跳必須另外授權，不能把第一跳允許當作任意外部請求的許可。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="80" y="20" width="200" height="55" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="180.0" y="55.5" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">評測沙盒</text><path d="M180 75 V420" stroke="#5c718a" stroke-dasharray="5 7"/><rect x="460" y="20" width="200" height="55" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="560.0" y="55.5" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">套件代理</text><path d="M560 75 V420" stroke="#5c718a" stroke-dasharray="5 7"/><rect x="840" y="20" width="200" height="55" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="940.0" y="55.5" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">外部目的地</text><path d="M940 75 V420" stroke="#5c718a" stroke-dasharray="5 7"/><path d="M180 130 L560 130" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="274.0" y="93" width="192" height="30" rx="4" fill="#0b1422"/><text x="370" y="115" font-size="22" fill="#99d4ff" text-anchor="middle" font-weight="400">① 允許套件請求</text><path d="M560 215 L940 215" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="632.0" y="176" width="236" height="30" rx="4" fill="#0b1422"/><text x="750" y="198" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">② 代理代發其他請求</text><path d="M940 295 L560 295" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)" stroke-dasharray="7 5"/><rect x="676.0" y="258" width="148" height="30" rx="4" fill="#0b1422"/><text x="750" y="280" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">③ 回傳內容</text><path d="M560 370 L180 370" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)" stroke-dasharray="7 5"/><rect x="274.0" y="333" width="192" height="30" rx="4" fill="#0b1422"/><text x="370" y="355" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">④ 內容回到沙盒</text><text x="560" y="450" font-size="25" fill="#93dfbd" text-anchor="middle" font-weight="400">第一跳的許可，不能替代第二跳的授權。</text></g></svg>