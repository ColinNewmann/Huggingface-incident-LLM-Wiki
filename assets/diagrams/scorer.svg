<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">代理想像與實際評分規則對照圖</title><desc id="desc">代理以為取得正確 flag 之外還必須證明取得途徑正當，因此研究評分器。OpenAI 後續稱其內部評分實作沒有檢查後者。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="20" y="25" width="510" height="390" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="38" y="55" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">代理以為的條件</text><rect x="590" y="25" width="510" height="390" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="608" y="55" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">OpenAI 說明的內部實作</text><rect x="70" y="95" width="410" height="70" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="275.0" y="130.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">正確 flag</text><text x="275.0" y="159.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">評測成功標記</text><rect x="70" y="265" width="410" height="70" rx="8" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="275.0" y="300.0" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">正當取得途徑</text><text x="275.0" y="329.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">代理以為仍需通過這關</text><rect x="640" y="95" width="410" height="70" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="845.0" y="130.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">正確 flag</text><text x="845.0" y="159.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">評測成功標記</text><rect x="640" y="265" width="410" height="70" rx="8" fill="#15243a" stroke="#93dfbd" stroke-width="2"/><text x="845.0" y="308.0" font-size="25" fill="#93dfbd" text-anchor="middle" font-weight="650">未檢查取得途徑</text><path d="M275 165 L275 265" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="240.0" y="203" width="70" height="30" rx="4" fill="#0b1422"/><text x="275" y="225" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">還要</text><path d="M845 165 L845 265" stroke="#93dfbd" stroke-width="2.5" fill="none" marker-end="url(#green)"/><rect x="793.0" y="203" width="104" height="30" rx="4" fill="#0b1422"/><text x="845" y="225" font-size="22" fill="#93dfbd" text-anchor="middle" font-weight="400">實際規則</text><text x="560" y="455" font-size="25" fill="#bdcbdb" text-anchor="middle" font-weight="400">錯誤的評分器想像，持續推動額外的越界研究。</text></g></svg>