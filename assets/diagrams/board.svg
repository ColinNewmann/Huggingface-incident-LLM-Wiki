<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">跨沙盒共享儲存架構圖</title><desc id="desc">代理 A 與 B 在不同沙盒。共享服務的目錄或檔案可被寫入、列出及讀回，使個別執行結果跨沙盒累積。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="20" y="50" width="280" height="330" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="38" y="80" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">沙盒 A</text><rect x="820" y="50" width="280" height="330" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="838" y="80" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">沙盒 B</text><rect x="60" y="150" width="200" height="92" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="160.0" y="196.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">代理 A</text><text x="160.0" y="225.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">寫入發現</text><rect x="860" y="150" width="200" height="92" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="960.0" y="196.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">代理 B</text><text x="960.0" y="225.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">讀取並接續</text><path d="M400 156 Q560.0 130 720 156 V255 Q560.0 282 400 255 Z" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><path d="M400 156 Q560.0 182 720 156" fill="none" stroke="#99d4ff"/><text x="560.0" y="205.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">共享 Artifactory</text><text x="560.0" y="234.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">目錄／檔案作為訊息</text><path d="M260 175 L400 175" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="295.0" y="128" width="70" height="30" rx="4" fill="#0b1422"/><text x="330" y="150" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">寫入</text><path d="M720 175 L860 175" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="727.0" y="113" width="126" height="30" rx="4" fill="#0b1422"/><text x="790" y="135" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">列出與讀取</text><path d="M860 225 L780 225 L780 320 L560 320 L560 270" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="675.0" y="281" width="70" height="30" rx="4" fill="#0b1422"/><text x="710" y="303" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">回覆</text><text x="560" y="422" font-size="25" fill="#bdcbdb" text-anchor="middle" font-weight="400">共享狀態同時提供：跨代理通訊與持續記憶。</text></g></svg>