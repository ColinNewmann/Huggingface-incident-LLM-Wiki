<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">模板處理活動圖</title><desc id="desc">同一輸入字串分為兩條處理路徑。固定模板把輸入當變數而保留文字；把輸入再次編譯為模板來源則會求值。求值得 49 不等於已證明 RCE。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="370" y="20" width="380" height="64" rx="32.0" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="560.0" y="60.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">輸入：{{ 7 * 7 }}</text><rect x="20" y="125" width="510" height="300" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="38" y="155" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">路徑 A：資料維持為資料</text><rect x="590" y="125" width="510" height="300" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="608" y="155" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">路徑 B：資料變成模板來源</text><rect x="90" y="190" width="370" height="75" rx="8" fill="#15243a" stroke="#93dfbd" stroke-width="2"/><text x="275.0" y="235.5" font-size="25" fill="#93dfbd" text-anchor="middle" font-weight="650">固定模板＋輸入變數</text><rect x="660" y="190" width="370" height="75" rx="8" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="845.0" y="235.5" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">再次編譯輸入</text><rect x="90" y="330" width="370" height="62" rx="31.0" fill="#15243a" stroke="#93dfbd" stroke-width="2"/><text x="275.0" y="369.0" font-size="25" fill="#93dfbd" text-anchor="middle" font-weight="650">輸出：{{ 7 * 7 }}</text><rect x="660" y="330" width="370" height="62" rx="31.0" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="845.0" y="369.0" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">輸出：49</text><path d="M465 84 L465 105 L275 105 L275 190" stroke="#93dfbd" stroke-width="2.5" fill="none" marker-end="url(#green)"/><path d="M655 84 L655 105 L845 105 L845 190" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><path d="M275 265 L275 330" stroke="#93dfbd" stroke-width="2.5" fill="none" marker-end="url(#green)"/><rect x="240.0" y="286" width="70" height="30" rx="4" fill="#0b1422"/><text x="275" y="308" font-size="22" fill="#93dfbd" text-anchor="middle" font-weight="400">傳值</text><path d="M845 265 L845 330" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="782.0" y="286" width="126" height="30" rx="4" fill="#0b1422"/><text x="845" y="308" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">解析與求值</text></g></svg>