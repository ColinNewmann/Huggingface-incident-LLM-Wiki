<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">API 驗證與授權流程圖</title><desc id="desc">API 請求先驗證 token 簽章、期限及受眾，再透過 RBAC 檢查身分對資源的操作權限。任一檢查失敗就拒絕。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="25" y="150" width="185" height="80" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="117.5" y="190.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">API 請求</text><text x="117.5" y="219.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">攜帶 token</text><path d="M402.5 100 L505 190.0 L402.5 280 L300 190.0 Z" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="402.5" y="198.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">身分有效？</text><text x="402.5" y="82" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">簽章／期限／受眾</text><path d="M722.5 100 L825 190.0 L722.5 280 L620 190.0 Z" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="722.5" y="198.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">權限足夠？</text><text x="722.5" y="82" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">RBAC 操作與資源</text><rect x="915" y="150" width="180" height="80" rx="40.0" fill="#15243a" stroke="#93dfbd" stroke-width="2"/><text x="1005.0" y="198.0" font-size="25" fill="#93dfbd" text-anchor="middle" font-weight="650">執行操作</text><rect x="465" y="355" width="265" height="65" rx="32.5" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="597.5" y="395.5" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">拒絕請求</text><path d="M210 190 L300 190" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><path d="M505 190 L620 190" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="527.0" y="145" width="70" height="30" rx="4" fill="#0b1422"/><text x="562" y="167" font-size="22" fill="#99d4ff" text-anchor="middle" font-weight="400">是</text><path d="M825 190 L915 190" stroke="#93dfbd" stroke-width="2.5" fill="none" marker-end="url(#green)"/><rect x="835.0" y="145" width="70" height="30" rx="4" fill="#0b1422"/><text x="870" y="167" font-size="22" fill="#93dfbd" text-anchor="middle" font-weight="400">是</text><path d="M402 280 L402 387 L465 387" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="367.0" y="313" width="70" height="30" rx="4" fill="#0b1422"/><text x="402" y="335" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">否</text><path d="M722 280 L722 355" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="715.0" y="306" width="70" height="30" rx="4" fill="#0b1422"/><text x="750" y="328" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">否</text></g></svg>