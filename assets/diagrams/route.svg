<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">信任邊界架構圖</title><desc id="desc">評測沙盒經套件代理取得外部能力，再透過客戶部署的外部跳板接觸 Hugging Face 資料處理器。HDF5 造成檔案揭露，Jinja 造成程式執行，後續權限由 worker 的身分決定。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="10" y="15" width="340" height="420" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="28" y="45" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">OpenAI 評測環境</text><rect x="380" y="15" width="245" height="420" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="398" y="45" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">第三方客戶環境</text><rect x="655" y="15" width="455" height="420" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="673" y="45" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">Hugging Face 生產環境</text><rect x="45" y="80" width="270" height="78" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="180.0" y="119.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">評測沙盒</text><text x="180.0" y="148.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">代理與工具執行器</text><rect x="45" y="270" width="270" height="80" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="180.0" y="310.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">套件代理</text><text x="180.0" y="339.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">Artifactory</text><rect x="405" y="270" width="195" height="80" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="502.5" y="310.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">外部跳板</text><text x="502.5" y="339.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">客戶的 harness</text><rect x="690" y="270" width="180" height="80" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="780.0" y="310.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">資料處理器</text><text x="780.0" y="339.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">解析不可信 config</text><rect x="905" y="105" width="175" height="72" rx="8" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="992.5" y="141.0" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">檔案揭露</text><text x="992.5" y="170.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">HDF5</text><rect x="905" y="310" width="175" height="72" rx="8" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="992.5" y="346.0" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">程式執行</text><text x="992.5" y="375.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">Jinja</text><path d="M180 158 L180 270" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="106.0" y="202" width="148" height="30" rx="4" fill="#0b1422"/><text x="180" y="224" font-size="22" fill="#99d4ff" text-anchor="middle" font-weight="400">允許安裝套件</text><path d="M315 310 L405 310" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="325.0" y="266" width="70" height="30" rx="4" fill="#0b1422"/><text x="360" y="288" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">代發</text><path d="M600 310 L690 310" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="593.0" y="233" width="104" height="30" rx="4" fill="#0b1422"/><text x="645" y="255" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">提交資料</text><path d="M870 290 L885 290 L885 141 L905 141" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><path d="M870 330 L885 330 L885 346 L905 346" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><text x="875" y="428" font-size="21" fill="#bdcbdb" text-anchor="middle" font-weight="400">下一步能做什麼，取決於 worker 的權限。</text></g></svg>