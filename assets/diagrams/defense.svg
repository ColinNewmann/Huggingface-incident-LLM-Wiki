<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">分層防護部署架構圖</title><desc id="desc">代理的工具動作先經出口政策，資料解析放在隔離 worker，後續服務另做最小權限授權。獨立稽核連接監測與中止流程，跨層限制能力擴張。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="20" y="20" width="1080" height="300" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="38" y="50" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">執行路徑：每一層都重新判斷授權</text><rect x="45" y="115" width="190" height="85" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="140.0" y="157.5" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">代理工具</text><text x="140.0" y="186.5" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">提出操作</text><rect x="320" y="115" width="220" height="85" rx="8" fill="#15243a" stroke="#93dfbd" stroke-width="2"/><text x="430.0" y="157.5" font-size="25" fill="#93dfbd" text-anchor="middle" font-weight="650">出口政策</text><text x="430.0" y="186.5" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">操作＋目的地</text><rect x="615" y="115" width="220" height="85" rx="8" fill="#15243a" stroke="#93dfbd" stroke-width="2"/><text x="725.0" y="157.5" font-size="25" fill="#93dfbd" text-anchor="middle" font-weight="650">隔離解析器</text><text x="725.0" y="186.5" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">限制讀檔與模板</text><rect x="915" y="115" width="160" height="85" rx="8" fill="#15243a" stroke="#93dfbd" stroke-width="2"/><text x="995.0" y="157.5" font-size="25" fill="#93dfbd" text-anchor="middle" font-weight="650">內部服務</text><text x="995.0" y="186.5" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">最小權限</text><path d="M235 157 L320 157" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><path d="M540 157 L615 157" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><path d="M835 157 L915 157" stroke="#99d4ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/><rect x="320" y="365" width="515" height="65" rx="32.5" fill="#15243a" stroke="#93dfbd" stroke-width="2"/><text x="577.5" y="405.5" font-size="25" fill="#93dfbd" text-anchor="middle" font-weight="650">獨立稽核 → 告警 → 中止</text><path d="M140 200 L140 397 L320 397" stroke="#93dfbd" stroke-width="2.5" fill="none" marker-end="url(#green)"/><rect x="111.0" y="328" width="148" height="30" rx="4" fill="#0b1422"/><text x="185" y="350" font-size="22" fill="#93dfbd" text-anchor="middle" font-weight="400">真實執行紀錄</text><path d="M725 200 L725 365" stroke="#93dfbd" stroke-width="2.5" fill="none" marker-end="url(#green)" stroke-dasharray="7 5"/><path d="M995 200 L995 397 L835 397" stroke="#93dfbd" stroke-width="2.5" fill="none" marker-end="url(#green)" stroke-dasharray="7 5"/></g></svg>