<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc"><title id="title">HDF5 檔案揭露資料流圖</title><desc id="desc">不可信描述指定 external raw storage。worker 的載入器以自身權限開啟本機檔案，位元組成為資料列並透過資料 API 回傳。此向量是讀檔而非程式執行。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#99d4ff"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb783"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93dfbd"/></marker></defs><g font-family="Microsoft JhengHei,Noto Sans TC,sans-serif"><rect x="25" y="85" width="235" height="90" rx="8" fill="#15243a" stroke="#ffb783" stroke-width="2"/><text x="142.5" y="130.0" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">資料描述</text><text x="142.5" y="159.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">external raw storage</text><rect x="310" y="20" width="790" height="345" rx="12" fill="none" stroke="#5c718a" stroke-dasharray="7 6"/><text x="328" y="50" font-size="21" fill="#bdcbdb" text-anchor="start" font-weight="400">Hugging Face worker：檔案存取使用 worker 權限</text><rect x="355" y="85" width="245" height="90" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="477.5" y="130.0" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">① 資料載入器</text><text x="477.5" y="159.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">處理外部檔案參照</text><path d="M775 91 Q907.5 65 1040 91 V170 Q907.5 197 775 170 Z" fill="#15243a" stroke="#ffb783" stroke-width="2"/><path d="M775 91 Q907.5 117 1040 91" fill="none" stroke="#ffb783"/><text x="907.5" y="130.0" font-size="25" fill="#ffb783" text-anchor="middle" font-weight="650">本機檔案</text><text x="907.5" y="159.0" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">不應對外返回的內容</text><rect x="355" y="255" width="245" height="75" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="477.5" y="292.5" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">③ 資料列</text><text x="477.5" y="321.5" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">將位元組作為輸出</text><rect x="25" y="275" width="235" height="75" rx="8" fill="#15243a" stroke="#99d4ff" stroke-width="2"/><text x="142.5" y="312.5" font-size="25" fill="#99d4ff" text-anchor="middle" font-weight="650">④ 資料 API</text><text x="142.5" y="341.5" font-size="22" fill="#bdcbdb" text-anchor="middle" font-weight="400">呼叫者讀回內容</text><path d="M260 130 L355 130" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="271.0" y="83" width="70" height="30" rx="4" fill="#0b1422"/><text x="306" y="105" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">描述</text><path d="M600 110 L775 110" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="613.0" y="73" width="148" height="30" rx="4" fill="#0b1422"/><text x="687" y="95" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">② 開啟檔案</text><path d="M775 160 L690 160 L690 292 L600 292" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><rect x="649.0" y="203" width="82" height="30" rx="4" fill="#0b1422"/><text x="690" y="225" font-size="22" fill="#ffb783" text-anchor="middle" font-weight="400">位元組</text><path d="M355 292 L305 292 L305 312 L260 312" stroke="#ffb783" stroke-width="2.5" fill="none" marker-end="url(#orange)"/><text x="560" y="425" font-size="25" fill="#bdcbdb" text-anchor="middle" font-weight="400">入口 URL 合法，不代表解析器後續的本機讀取安全。</text></g></svg>